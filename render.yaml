# ═════════════════════════════════════════════════════════════════════════════
# Render Blueprint — نشر النظام على الإنترنت بخدمة واحدة
#
# خدمة واحدة بس هي اللي بتتنشر: نفس العملية بتشغّل الـ API والمهام المجدولة
# وقائمة الإرسال، وكمان بتقدّم الواجهة (الصورة في Dockerfile بتحط الواجهة
# المبنية في المكان اللي الخادم بيدوّر فيه عليها).
#
# ── الخطوات ──────────────────────────────────────────────────────────────────
#   ١. ارفع المشروع على مستودع GitHub خاص (server/.env مستبعَد من Git — سيبه كده).
#   ٢. من render.com:  New ← Blueprint ← اختار المستودع.
#   ٣. Render هيقرا الملف ده ويسألك عن المتغيّرات المكتوب جنبها sync: false —
#      دي القيم السرّية، بتتكتب في لوحة التحكم مش في الملف.
#   ٤. Apply. أول بناء بياخد من ٥ لـ ١٠ دقايق (بناء صورة Docker كاملة).
#   ٥. افتح https://<الاسم>.onrender.com/api/health — لازم يرد {"ok":true}.
#   ٦. سجّل دخول، وغيّر كلمة المرور فوراً من الإعدادات ← الحساب.
#
# ⚠️ الباقة المجانية بتنيّم الخدمة بعد ~١٥ دقيقة من غير طلبات، وأول طلب بعدها
#    بياخد ٣٠–٦٠ ثانية، والمهام المجدولة مش بتشتغل وهي نايمة. الحل المجاني:
#    مهمة على cron-job.org تنده /api/health كل ١٠ دقايق (تفاصيلها في
#    docs/05-النشر-والموبايل.md).
#
# 📱 بعد أول نشر ناجح، اربط تطبيق الأندرويد بالعنوان الجديد:
#      node scripts/set-api-base.mjs https://<الاسم>.onrender.com
#      npm run apk
# ═════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: mr-ahmed
    # `runtime: docker` هو المفتاح الحالي؛ الحسابات القديمة بتستخدم `env: docker`
    # وله نفس المعنى بالظبط.
    runtime: docker
    plan: free
    region: frankfurt # أقرب منطقة لمصر
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # المسار ده عام ومش محتاج تسجيل دخول، فـ Render بيقدر يتأكد إن الخدمة قامت
    # فعلاً قبل ما يحوّل عليها الزوّار.
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── قاعدة البيانات (Supabase) ────────────────────────────────────────
      # انسخ نفس السطرين اللي في server/.env بالظبط، من غير أي تعديل:
      #   DATABASE_URL → منفذ الـ pooler 6543  (تشغيل التطبيق)
      #   DIRECT_URL   → منفذ الـ pooler 5432  (أوامر تعديل الجداول)
      # ⚠️ سيب `connect_timeout=60` في آخر الرابطين — من غيره الاتصال بيفشل.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ── المصادقة ────────────────────────────────────────────────────────
      # Render بيولّد مفتاحاً عشوائياً طويلاً من نفسه، فمفيش داعي تكتب حاجة.
      # تغييره بعد كده بيخرّج كل الأجهزة المسجّلة — وده سلوك مقصود.
      - key: JWT_SECRET
        generateValue: true

      # ── حساب المالك ─────────────────────────────────────────────────────
      # القيم دي بيقراها `db:seed` وقت تجهيز قاعدة البيانات. لو قاعدة البيانات
      # متجهّزة من اللابتوب بالفعل، سيبها بنفس القيم اللي في server/.env عشان
      # ما تتلخبطش. ومتحطش كلمة مرور قصيرة على خادم منشور على الإنترنت.
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false

      # ── CORS ────────────────────────────────────────────────────────────
      # حط عنوان الخدمة نفسها، مثلاً: https://mr-ahmed.onrender.com
      # (عناوين *.onrender.com و *.fly.dev و capacitor:// و localhost مقبولة
      #  تلقائياً من server/src/index.ts، فالمتغيّر ده للعناوين الإضافية بس —
      #  زي دومين خاص بيك.)
      - key: CORS_ORIGINS
        sync: false

      # المنفذ اللي الخادم بيسمع عليه جوّه الصورة. مش سرّ ومش بيتغيّر، فمتكتوبش
      # هنا كـ sync: false عشان ما يوقفش النشر منتظر قيمة يدوية.
      - key: PORT
        value: "4000"
